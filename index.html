<script>
  // The game moved to /voltbreak. Take the old offline copy away, then go there (keeping challenge links).
  (function () {
    var to = 'https://blixenzach.github.io/voltbreak/' + location.search + location.hash;
    try { navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
    try { caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('zak-breakout-') === 0) caches.delete(k); }); }); } catch (e) {}
    location.replace(to);
  })();
</script>
